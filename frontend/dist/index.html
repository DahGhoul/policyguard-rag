<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

<body class="min-h-screen flex flex-col">
  <div id="app"></div>

  <script>
    // =====================================================================
    // ESTADO GLOBAL DE LA APLICACIÓN SPA (PolicyGuard-RAG · Caso 21)
    // =====================================================================
    const state = {
      token: localStorage.getItem('pg_token') || null,
      user: JSON.parse(localStorage.getItem('pg_user') || 'null'),
      activeTab: 'dashboard', // dashboard | rag | policies | reports | audit | users
      summary: null,
      policies: [],
      selectedPolicy: null,
      ragMessages: [
        {
          role: 'assistant',
          text: '¡Hola! Soy el **Agente PolicyGuard-RAG** (impulsado por **LangChain + LangFlow + pgvector**). Pregúntame cualquier duda sobre las políticas ISO 27001 de la organización y te responderé citando el **Artículo y Página exacta**.',
          citations: [],
          confidence: 0.99,
          latency: 14
        }
      ],
      ragHistory: [],
      auditLogs: [],
      chainVerify: null,
      tamperResult: null,
      usersList: [],
      loading: false,
      toast: null,
      showNewPolicyModal: false
    };

    function showToast(msg, type = 'success') {
      state.toast = { msg, type };
      render();
      setTimeout(() => { state.toast = null; render(); }, 4500);
    }

    async function apiFetch(path, options = {}) {
      const headers = options.headers || {};
      if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
      if (!(options.body instanceof URLSearchParams) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        logout();
        throw new Error('Sesión expirada o credenciales inválidas');
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error en la petición');
      return data;
    }

    async function login(username, password) {
      try {
        state.loading = true; render();
        const body = new URLSearchParams({ username, password });
        const data = await apiFetch('/api/v1/auth/login', { method: 'POST', body });
        state.token = data.access_token;
        state.user = data.user;
        localStorage.setItem('pg_token', data.access_token);
        localStorage.setItem('pg_user', JSON.stringify(data.user));
        showToast(`Bienvenido, ${data.user.full_name} (${data.user.roles.join(', ')})`);
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        state.loading = false; render();
      }
    }

    function logout() {
      state.token = null;
      state.user = null;
      localStorage.removeItem('pg_token');
      localStorage.removeItem('pg_user');
      render();
    }

    async function loadAllData() {
      if (!state.token) return;
      try {
        const [sum, pols, hist, aud, usrs] = await Promise.all([
          apiFetch('/api/v1/dashboard/summary'),
          apiFetch('/api/v1/policies'),
          apiFetch('/api/v1/rag/history'),
          apiFetch('/api/v1/audit/logs?limit=40'),
          apiFetch('/api/v1/users')
        ]);
        state.summary = sum;
        state.policies = pols.items;
        state.ragHistory = hist.items;
        state.auditLogs = aud.items;
        state.usersList = usrs.items;
        render();
      } catch (e) {
        console.error(e);
      }
    }

    async function openPolicyDetail(id) {
      try {
        const detail = await apiFetch(`/api/v1/policies/${id}`);
        state.selectedPolicy = detail;
        render();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function signAcknowledge(policyId) {
      try {
        const res = await apiFetch(`/api/v1/policies/${policyId}/acknowledge`, {
          method: 'POST',
          body: JSON.stringify({ comments: 'Lectura completa y conformidad firmada digitalmente desde PolicyGuard-RAG.' })
        });
        showToast(`Acuse firmado con éxito. Hash SHA-256: ${res.digital_signature.slice(0, 16)}...`);
        await loadAllData();
        if (state.selectedPolicy && state.selectedPolicy.policy.id === policyId) {
          await openPolicyDetail(policyId);
        }
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function sendRagQuestion(qText) {
      if (!qText || !qText.trim()) return;
      state.ragMessages.push({ role: 'user', text: qText });
      state.loading = true;
      render();
      try {
        const res = await apiFetch('/api/v1/rag/ask', {
          method: 'POST',
          body: JSON.stringify({ question: qText, top_k: 3 })
        });
        state.ragMessages.push({
          role: 'assistant',
          text: res.answer,
          citations: res.citations,
          confidence: res.confidence_score,
          latency: res.latency_ms,
          restricted: res.restricted_flagged,
          n8n: res.n8n_notified
        });
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function verifyHashChain() {
      try {
        const res = await apiFetch('/api/v1/audit/verify-chain');
        state.chainVerify = res;
        showToast(`Cadena SHA-256 verificada: ${res.checked_blocks} bloques íntegros (100% inmutable)`);
        render();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function simulateTamperAttack() {
      try {
        const res = await apiFetch('/api/v1/audit/test-immutability', { method: 'POST' });
        state.tamperResult = res;
        showToast('¡Trigger de PostgreSQL bloqueó el intento de DELETE en audit_log!', 'success');
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function downloadReport(reportType, format) {
      try {
        showToast(`Generando reporte ${reportType.toUpperCase()} en formato ${format.toUpperCase()}...`);
        const res = await fetch(`/api/v1/reports/export?report_type=${reportType}&format=${format}`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        if (!res.ok) throw new Error('Error generando el reporte');
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `PolicyGuard_${reportType}_${new Date().toISOString().slice(0,10)}.${format}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast(`Reporte ${format.toUpperCase()} descargado y registrado en bitácora SHA-256.`);
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function submitNewPolicy(ev) {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const payload = {
        code: fd.get('code'),
        title: fd.get('title'),
        category: fd.get('category'),
        classification: fd.get('classification'),
        iso_control: fd.get('iso_control'),
        version_number: fd.get('version_number'),
        summary: fd.get('summary'),
        content_markdown: fd.get('content_markdown'),
        changelog: fd.get('changelog')
      };
      try {
        const res = await apiFetch('/api/v1/policies', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        state.showNewPolicyModal = false;
        showToast(res.message);
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function formatMd(txt) {
      if (!txt) return '';
      return txt
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-cyan-300 font-semibold">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="text-slate-300">$1</em>')
        .replace(/\n/g, '<br/>');
    }

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="state.showNewPolicyModal=false;render();" class="px-4 py-2 rounded bg-slate-800 text-slate-300">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded bg-cyan-500 text-slate-950 font-bold">Publicar e Indexar en RAG</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.token || !state.user) {
        root.innerHTML = renderLogin();
        return;
      }

      const tabs = [
        { id: 'dashboard', label: '📊 Dashboard Adopción' },
        { id: 'rag', label: '🤖 Chatbot RAG (Citas)' },
        { id: 'policies', label: '📜 Políticas y Acuses' },
        { id: 'reports', label: '📥 Reportes (PDF/Word/Excel)' },
        { id: 'audit', label: '⛓️ Bitácora SHA-256' },
        { id: 'users', label: '👥 Usuarios y RBAC' }
      ];

      let contentHtml = '';
      if (state.activeTab === 'dashboard') contentHtml = renderDashboard();
      else if (state.activeTab === 'rag') contentHtml = renderRagChat();
      else if (state.activeTab === 'policies') contentHtml = renderPolicies();
      else if (state.activeTab === 'reports') contentHtml = renderReports();
      else if (state.activeTab === 'audit') contentHtml = renderAudit();
      else if (state.activeTab === 'users') contentHtml = renderUsers();

      root.innerHTML = `
        ${state.toast ? `
          <div class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold ${state.toast.type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' : 'bg-slate-900 border-cyan-400 text-cyan-200'}">
            ${state.toast.msg}
          </div>
        ` : ''}

        <header class="bg-slate-950/90 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
          <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow">PG</div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-white text-sm">PolicyGuard-RAG</span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 font-semibold">Caso 21 · ISO 27001 A.5.1</span>
                </div>
                <p class="text-[11px] text-slate-400">Gestor de Políticas con Chatbot RAG, Versionado y Acuses Digitales</p>
              </div>
            </div>

            <nav class="flex flex-wrap gap-1">
              ${tabs.map(t => `
                <button onclick="state.activeTab='${t.id}';render();" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${state.activeTab === t.id ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:text-white hover:bg-slate-900'}">
                  ${t.label}
                </button>
              `).join('')}
            </nav>

            <div class="flex items-center gap-3">
              <div class="text-right">
                <div class="text-xs font-semibold text-white">${state.user.full_name}</div>
                <div class="text-[10px] text-cyan-400 uppercase font-semibold">${state.user.roles.join(', ')} · ${state.user.department}</div>
              </div>
              <button onclick="logout()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-rose-950 hover:text-rose-300 text-slate-300 text-xs border border-slate-700">
                Salir
              </button>
            </div>
          </div>
        </header>

        <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-1">
          ${contentHtml}
        </main>

        ${renderNewPolicyModal()}
      `;
    }

    // Inicialización automática
    render();
    if (state.token) loadAllData();
  </script>
</body>
</html>
