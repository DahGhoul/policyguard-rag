<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolicyGuard-RAG | Gobernanza Normativa ISO/IEC 27001</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    const state = {
      token: localStorage.getItem('pg_token') || null,
      user: JSON.parse(localStorage.getItem('pg_user') || 'null'),
      activeTab: 'dashboard',
      summary: null,
      policies: [],
      selectedPolicy: null,
      mlBenchmark: null,
      ragMessages: [
        {
          role: 'assistant',
          text: 'Bienvenido al **Asistente Normativo PolicyGuard-RAG**. Formule consultas sobre las políticas ISO/IEC 27001 vigentes y obtendrá respuestas verificadas con cita exacta de **política, artículo y página**.',
          citations: [],
          confidence: 0.99,
          latency: 2
        }
      ],
      ragHistory: [],
      auditLogs: [],
      chainVerify: null,
      tamperResult: null,
      usersList: [],
      loading: false,
      toast: null,
      showNewPolicyModal: false
    };

    const ICONS = {
      shield: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
      dashboard: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>`,
      chat: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
      book: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
      lab: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg>`,
      file: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
      lock: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      users: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      check: `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      logout: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
      arrow: `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`
    };

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showToast(msg, type = 'success') {
      state.toast = { msg, type };
      render();
      setTimeout(() => { state.toast = null; render(); }, 4500);
    }

    async function apiFetch(path, options = {}) {
      const headers = options.headers || {};
      if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
      if (!(options.body instanceof URLSearchParams) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        logout();
        throw new Error('Sesión expirada o credenciales inválidas');
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Error en la petición');
      return data;
    }

    async function login(username, password) {
      try {
        state.loading = true; render();
        const body = new URLSearchParams({ username, password });
        const data = await apiFetch('/api/v1/auth/login', { method: 'POST', body });
        state.token = data.access_token;
        state.user = data.user;
        localStorage.setItem('pg_token', data.access_token);
        localStorage.setItem('pg_user', JSON.stringify(data.user));
        showToast(`Sesión iniciada: ${data.user.full_name}`);
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        state.loading = false; render();
      }
    }

    function logout() {
      state.token = null;
      state.user = null;
      localStorage.removeItem('pg_token');
      localStorage.removeItem('pg_user');
      render();
    }

    async function loadAllData() {
      if (!state.token) return;
      try {
        const [sum, pols, hist, aud, usrs, ml] = await Promise.all([
          apiFetch('/api/v1/dashboard/summary'),
          apiFetch('/api/v1/policies'),
          apiFetch('/api/v1/rag/history'),
          apiFetch('/api/v1/audit/logs?limit=40'),
          apiFetch('/api/v1/users'),
          apiFetch('/api/v1/ml/benchmark').catch(() => null)
        ]);
        state.summary = sum;
        state.policies = pols.items;
        state.ragHistory = hist.items;
        state.auditLogs = aud.items;
        state.usersList = usrs.items;
        state.mlBenchmark = ml;
        render();
      } catch (e) {
        console.error(e);
      }
    }

    async function openPolicyDetail(id) {
      try {
        state.selectedPolicy = await apiFetch(`/api/v1/policies/${id}`);
        render();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function signAcknowledge(policyId) {
      try {
        const res = await apiFetch(`/api/v1/policies/${policyId}/acknowledge`, {
          method: 'POST',
          body: JSON.stringify({ comments: 'Lectura completa y conformidad firmada digitalmente en PolicyGuard-RAG.' })
        });
        showToast(`Acuse firmado. Hash SHA-256: ${res.digital_signature.slice(0, 16)}...`);
        await loadAllData();
        if (state.selectedPolicy && state.selectedPolicy.policy.id === policyId) {
          await openPolicyDetail(policyId);
        }
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function sendRagQuestion(qText) {
      if (!qText || !qText.trim()) return;
      state.ragMessages.push({ role: 'user', text: qText });
      state.loading = true;
      render();
      try {
        const res = await apiFetch('/api/v1/rag/ask', {
          method: 'POST',
          body: JSON.stringify({ question: qText, top_k: 3 })
        });
        state.ragMessages.push({
          role: 'assistant',
          text: res.answer,
          citations: res.citations,
          confidence: res.confidence_score,
          latency: res.latency_ms,
          restricted: res.restricted_flagged,
          n8n: res.n8n_notified
        });
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        state.loading = false;
        render();
        const box = document.getElementById('chat-box');
        if (box) box.scrollTop = box.scrollHeight;
      }
    }

    async function verifyHashChain() {
      try {
        const res = await apiFetch('/api/v1/audit/verify-chain');
        state.chainVerify = res;
        showToast(`Cadena SHA-256 verificada: ${res.checked_blocks} bloques íntegros.`);
        render();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function simulateTamperAttack() {
      try {
        const res = await apiFetch('/api/v1/audit/test-immutability', { method: 'POST' });
        state.tamperResult = res;
        showToast('Control de inmutabilidad: intento DELETE bloqueado y auditado.');
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function downloadReport(reportType, format) {
      try {
        showToast(`Generando reporte ${reportType.toUpperCase()} (${format.toUpperCase()})...`);
        const res = await fetch(`/api/v1/reports/export?report_type=${reportType}&format=${format}`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        if (!res.ok) throw new Error('Error generando el reporte');
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `PolicyGuard_${reportType}_${new Date().toISOString().slice(0,10)}.${format}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast(`Reporte ${format.toUpperCase()} descargado y registrado en bitácora SHA-256.`);
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function submitNewPolicy(ev) {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const payload = {
        code: fd.get('code'),
        title: fd.get('title'),
        category: fd.get('category'),
        classification: fd.get('classification'),
        iso_control: fd.get('iso_control'),
        version_number: fd.get('version_number'),
        summary: fd.get('summary'),
        content_markdown: fd.get('content_markdown'),
        changelog: fd.get('changelog')
      };
      try {
        const res = await apiFetch('/api/v1/policies', { method: 'POST', body: JSON.stringify(payload) });
        state.showNewPolicyModal = false;
        showToast(res.message || 'Política publicada e indexada en RAG.');
        await loadAllData();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function formatMd(txt) {
      if (!txt) return '';
      return esc(txt)
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 font-semibold">$1</strong>')
        .replace(/\*(.*?)\*/g, '<em class="text-slate-700">$1</em>')
        .replace(/\n/g, '<br/>');
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 py-10">
          <div class="max-w-md w-full bg-white border border-slate-200 rounded-xl shadow-sm p-8">
            <div class="flex items-center gap-3 pb-6 border-b border-slate-100">
              <div class="w-10 h-10 rounded-lg bg-blue-700 text-white flex items-center justify-center font-bold text-sm">
                ${ICONS.shield}
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-lg font-bold text-slate-900 tracking-tight">PolicyGuard-RAG</h1>
                  <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">ISO 27001</span>
                </div>
                <p class="text-xs text-slate-500">Plataforma de Gobernanza Normativa y Auditoría</p>
              </div>
            </div>

            <form onsubmit="event.preventDefault(); login(this.username.value, this.password.value)" class="mt-6 space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">Usuario o correo institucional</label>
                <input name="username" value="admin" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-slate-900 text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">Contraseña</label>
                <input name="password" type="password" value="Admin123!" required class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-slate-900 text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 focus:outline-none" />
              </div>
              <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold text-sm shadow-sm transition">
                ${state.loading ? 'Autenticando...' : 'Iniciar sesión'}
              </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100">
              <p class="text-xs font-medium text-slate-500 mb-2.5">Acceso de evaluación por rol RBAC:</p>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="login('admin','Admin123!')" class="px-3 py-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-left border border-slate-200 transition">
                  <div class="font-semibold text-slate-900 mono">admin</div>
                  <div class="text-[11px] text-slate-500">Administrador</div>
                </button>
                <button onclick="login('analista1','Analyst123!')" class="px-3 py-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-left border border-slate-200 transition">
                  <div class="font-semibold text-slate-900 mono">analista1</div>
                  <div class="text-[11px] text-slate-500">Analista GRC</div>
                </button>
                <button onclick="login('gestor','Manager123!')" class="px-3 py-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-left border border-slate-200 transition">
                  <div class="font-semibold text-slate-900 mono">gestor</div>
                  <div class="text-[11px] text-slate-500">Gestor de Reportes</div>
                </button>
                <button onclick="login('auditor1','Audit123!')" class="px-3 py-2 rounded-lg bg-slate-50 hover:bg-slate-100 text-left border border-slate-200 transition">
                  <div class="font-semibold text-slate-900 mono">auditor1</div>
                  <div class="text-[11px] text-slate-500">Auditor Forense</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      const s = state.summary;
      if (!s) return `<div class="p-8 text-sm text-slate-500">Cargando indicadores de cumplimiento...</div>`;
      const k = s.kpis;
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-semibold text-slate-900">Resumen Ejecutivo de Cumplimiento</h2>
              <p class="text-xs text-slate-500">Estado vigente del Sistema de Gestión de Seguridad de la Información (ISO/IEC 27001 A.5.1)</p>
            </div>
            <span class="text-xs font-medium px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200">Operativo · ${k.total_chunks} artículos indexados</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <p class="text-xs font-medium text-slate-500">Políticas Publicadas</p>
              <div class="mt-2 flex items-baseline justify-between">
                <p class="text-2xl font-bold text-slate-900">${k.total_policies}</p>
                <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-700 mono">${k.total_chunks} fragmentos</span>
              </div>
              <p class="text-xs text-slate-500 mt-2">${k.total_versions} versiones registradas con hash SHA-256</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <p class="text-xs font-medium text-slate-500">Adopción Global (Acuses)</p>
              <div class="mt-2 flex items-baseline justify-between">
                <p class="text-2xl font-bold text-emerald-700">${k.global_adoption_pct}%</p>
                <span class="text-xs font-medium px-2 py-0.5 rounded bg-emerald-50 text-emerald-700">${k.total_acknowledgments} firmas</span>
              </div>
              <p class="text-xs text-slate-500 mt-2">Conformidad digital por versión vigente</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <p class="text-xs font-medium text-slate-500">Consultas Asistente RAG</p>
              <div class="mt-2 flex items-baseline justify-between">
                <p class="text-2xl font-bold text-blue-700">${k.total_rag_queries}</p>
                <span class="text-xs font-medium px-2 py-0.5 rounded bg-blue-50 text-blue-700">${k.avg_confidence_pct}% confianza</span>
              </div>
              <p class="text-xs text-slate-500 mt-2">Latencia media de respuesta: <span class="font-semibold text-slate-700">${k.avg_latency_ms} ms</span></p>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <p class="text-xs font-medium text-slate-500">Acuses Pendientes (Usuario)</p>
              <div class="mt-2 flex items-center justify-between">
                <p class="text-2xl font-bold ${k.user_pending_acks > 0 ? 'text-amber-700' : 'text-emerald-700'}">${k.user_pending_acks}</p>
                <button onclick="state.activeTab='policies';render();" class="inline-flex items-center gap-1 text-xs font-semibold text-blue-700 hover:text-blue-800">
                  Revisar ${ICONS.arrow}
                </button>
              </div>
              <p class="text-xs text-slate-500 mt-2">Requiere firma digital de lectura</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="text-sm font-semibold text-slate-900">Adopción por Política Normativa</h3>
                  <p class="text-xs text-slate-500">Colaboradores que firmaron la versión vigente</p>
                </div>
                <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600">Meta 100%</span>
              </div>
              <div class="space-y-4">
                ${s.adoption_by_policy.map(p => `
                  <div>
                    <div class="flex justify-between text-xs mb-1.5">
                      <span class="text-slate-700 font-medium"><span class="mono font-semibold text-blue-700">${esc(p.code)}</span> v${esc(p.version)} · ${esc(p.title.slice(0,46))}</span>
                      <span class="mono font-semibold text-slate-700">${p.acknowledged}/${k.total_users} (${p.adoption_pct}%)</span>
                    </div>
                    <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div class="h-full bg-blue-700 rounded-full" style="width: ${p.adoption_pct}%"></div>

                  </div>

              </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
              <div class="mb-4">
                <h3 class="text-sm font-semibold text-slate-900">Cumplimiento por Departamento</h3>
                <p class="text-xs text-slate-500">Cobertura de acuses frente a la meta organizacional (75%)</p>
              </div>
              <div class="space-y-3">
                ${s.adoption_by_department.map(d => `
                  <div class="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-200/80">
                    <div>
                      <div class="text-xs font-semibold text-slate-900">${esc(d.department)}</div>
                      <div class="text-[11px] text-slate-500">${d.users} colaborador(es) · ${d.acknowledgments}/${d.target} acuses</div>
                    </div>
                    <div class="flex items-center gap-3">
                      <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div class="h-full ${d.compliance_pct >= 75 ? 'bg-emerald-600' : d.compliance_pct >= 50 ? 'bg-amber-600' : 'bg-rose-600'}" style="width: ${d.compliance_pct}%"></div>
                      </div>
                      <span class="text-xs font-semibold mono w-12 text-right ${d.compliance_pct >= 75 ? 'text-emerald-700' : 'text-amber-700'}">${d.compliance_pct}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-sm font-semibold text-slate-900">Consultas Recientes al Motor RAG</h3>

              </div>
              <button onclick="state.activeTab='rag';render();" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-medium border border-slate-200">
                Abrir Asistente
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="text-slate-500 border-b border-slate-200 bg-slate-50/70">
                  <tr>
                    <th class="p-2.5 font-medium">Usuario</th>
                    <th class="p-2.5 font-medium">Departamento</th>

          ${state.chainVerify ? `
            <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-xs space-y-1">
              <div class="font-semibold text-emerald-800 text-sm">Cadena íntegra verificada (${state.chainVerify.checked_blocks} bloques)</div>
              <div class="text-emerald-700">${esc(state.chainVerify.standard)} · Enlaces rotos: <strong>${state.chainVerify.broken_links.length}</strong></div>
              <div class="mono text-[11px] text-emerald-800">Último hash: ${esc(state.chainVerify.last_block_hash)}</div>
            </div>
          ` : ''}

          ${state.tamperResult ? `
            <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-xs space-y-1">
              <div class="font-semibold text-rose-800 text-sm">${esc(state.tamperResult.message)}</div>
              <div class="text-rose-700">Mecanismo: <code class="mono font-semibold">${esc(state.tamperResult.trigger_name)}</code></div>
              <div class="mono text-[11px] text-rose-900 bg-white border border-rose-200 p-2 rounded mt-1">${esc(state.tamperResult.postgres_exception)}</div>
            </div>
          ` : ''}

          <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                  <tr>
                    <th class="p-3 font-semibold">ID</th>
                    <th class="p-3 font-semibold">Fecha UTC</th>
                    <th class="p-3 font-semibold">Usuario / Rol</th>
                    <th class="p-3 font-semibold">Módulo · Acción</th>
                    <th class="p-3 font-semibold">Detalle</th>
                    <th class="p-3 font-semibold">Cadena SHA-256</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${state.auditLogs.map(a => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 mono font-semibold text-slate-700">#${a.id}</td>
                      <td class="p-3 mono text-[11px] text-slate-500">${esc(new Date(a.occurred_at).toISOString().replace('T',' ').slice(0,19))}</td>
                      <td class="p-3"><span class="font-semibold text-blue-700 mono">${esc(a.username)}</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${esc(a.role_code || '')}</span></td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded font-medium ${a.severity === 'critical' ? 'bg-rose-50 text-rose-700 border border-rose-200' : a.severity === 'warning' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-slate-100 text-slate-700'}">${esc(a.module)}:${esc(a.action)}</span></td>
                      <td class="p-3 text-slate-700">${esc(a.detail || '')}</td>
                      <td class="p-3 mono text-[10px] text-emerald-700">${esc((a.hash_prev||'').slice(0,10))} → ${esc((a.hash_self||'').slice(0,14))}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderUsers() {
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-lg font-semibold text-slate-900">Control de Acceso Basado en Roles (RBAC)</h2>
            <p class="text-xs text-slate-500">Gestión de identidad corporativa bajo 5 roles diferenciados</p>
          </div>

          <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-600 border-b border-slate-200">
                <tr>
                  <th class="p-3 font-semibold">ID</th>
                  <th class="p-3 font-semibold">Usuario</th>
                  <th class="p-3 font-semibold">Nombre Completo</th>
                  <th class="p-3 font-semibold">Departamento / Cargo</th>
                  <th class="p-3 font-semibold">Roles RBAC</th>
                  <th class="p-3 font-semibold">Acuses</th>
                  <th class="p-3 font-semibold">Estado</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.usersList.map(u => `
                  <tr class="hover:bg-slate-50">
                    <td class="p-3 mono text-slate-500">#${u.id}</td>
                    <td class="p-3 mono font-semibold text-blue-700">${esc(u.username)}</td>
                    <td class="p-3 font-medium text-slate-900">${esc(u.full_name)}<div class="text-[11px] text-slate-500">${esc(u.email)}</div></td>
                    <td class="p-3 text-slate-700">${esc(u.department)}<div class="text-[11px] text-slate-500">${esc(u.job_title || '')}</div></td>
                    <td class="p-3">${(u.roles || []).map(r => `<span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 font-medium">${esc(r)}</span>`).join(' ')}</td>
                    <td class="p-3 font-semibold text-emerald-700 mono">${u.acks_signed} / ${state.policies.length}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium">Activo</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderNewPolicyModal() {
      if (!state.showNewPolicyModal) return '';
      return `
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div class="bg-white border border-slate-200 rounded-xl shadow-xl max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 class="text-sm font-bold text-slate-900">Publicar o Versionar Política Normativa</h3>
              <button onclick="state.showNewPolicyModal=false;render();" class="text-slate-400 hover:text-slate-700 text-sm font-semibold">Cerrar</button>
            </div>
            <form onsubmit="submitNewPolicy(event)" class="space-y-3 text-xs">
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">Código</label>
                  <input name="code" value="POL-SEG-006" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900" />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">Versión</label>
                  <input name="version_number" value="1.0" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900" />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">Clasificación</label>
                  <select name="classification" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900">
                    <option value="INTERNAL">INTERNAL</option>
                    <option value="CONFIDENTIAL">CONFIDENTIAL</option>
                    <option value="RESTRICTED">RESTRICTED</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">Título</label>
                  <input name="title" value="Política de Copias de Respaldo (3-2-1) y Recuperación" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900" />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">Control ISO 27001</label>
                  <input name="iso_control" value="ISO 27001 A.8.13" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900" />
                </div>
              </div>
              <input type="hidden" name="category" value="Continuidad y Respaldo" />
              <div>
                <label class="block font-medium text-slate-700 mb-1">Resumen Ejecutivo</label>
                <input name="summary" value="Establece respaldos inmutables 3-2-1 y pruebas trimestrales de restauración." required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900" />
              </div>
              <div>
                <label class="block font-medium text-slate-700 mb-1">Contenido (Use '## Artículo X' para chunking automático)</label>
                <textarea name="content_markdown" rows="5" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-slate-900 mono">## Artículo 1. Regla 3-2-1 de Copias de Seguridad (Página 1)
Toda base de datos crítica debe mantener 3 copias en 2 medios distintos y 1 copia inmutable fuera del sitio con cifrado AES-256.

## Artículo 2. Pruebas de Restauración RPO/RTO (Página 2)
El equipo de TI ejecutará pruebas trimestrales documentadas con RPO máximo de 15 minutos y RTO de 2 horas.</textarea>
              </div>
              <input type="hidden" name="changelog" value="Emisión e indexación automática en motor RAG." />
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="state.showNewPolicyModal=false;render();" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-medium">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold">Publicar e Indexar</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.token || !state.user) {
        root.innerHTML = renderLogin();
        return;
      }

      const tabs = [
        { id: 'dashboard', label: 'Resumen Ejecutivo', icon: ICONS.dashboard },
        { id: 'rag', label: 'Asistente RAG', icon: ICONS.chat },
        { id: 'policies', label: 'Políticas y Acuses', icon: ICONS.book },
        { id: 'ml', label: 'Laboratorio ML / Optuna', icon: ICONS.lab },
        { id: 'reports', label: 'Reportes', icon: ICONS.file },
        { id: 'audit', label: 'Bitácora SHA-256', icon: ICONS.lock },
        { id: 'users', label: 'Usuarios y RBAC', icon: ICONS.users }
      ];

      let contentHtml = '';
      if (state.activeTab === 'dashboard') contentHtml = renderDashboard();
      else if (state.activeTab === 'rag') contentHtml = renderRagChat();
      else if (state.activeTab === 'policies') contentHtml = renderPolicies();
      else if (state.activeTab === 'ml') contentHtml = renderMlLab();
      else if (state.activeTab === 'reports') contentHtml = renderReports();
      else if (state.activeTab === 'audit') contentHtml = renderAudit();
      else if (state.activeTab === 'users') contentHtml = renderUsers();

      root.innerHTML = `
        ${state.toast ? `
          <div class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg border text-xs font-medium ${state.toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-white border-slate-200 text-slate-900'}">
            ${esc(state.toast.msg)}
          </div>
        ` : ''}

        <div class="min-h-screen flex bg-slate-50">
          <!-- Sidebar corporativa fija -->
          <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col justify-between shrink-0">
            <div>
              <div class="px-5 py-4 border-b border-slate-200 flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-700 text-white flex items-center justify-center">${ICONS.shield}</div>
                <div>
                  <div class="font-bold text-sm text-slate-900 leading-tight">PolicyGuard-RAG</div>
                  <div class="text-[11px] text-slate-500">Caso 21 · ISO 27001 A.5.1</div>
                </div>
              </div>

              <nav class="p-3 space-y-1">
                ${tabs.map(t => `
                  <button onclick="state.activeTab='${t.id}';render();" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition ${state.activeTab === t.id ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}">
                    ${t.icon}
                    <span>${t.label}</span>
                  </button>
                `).join('')}
              </nav>
            </div>

            <div class="p-4 border-t border-slate-200 bg-slate-50/60">
              <div class="text-xs font-semibold text-slate-900 truncate">${esc(state.user.full_name)}</div>
              <div class="text-[11px] text-slate-500 truncate">${esc((state.user.roles||[]).join(', '))} · ${esc(state.user.department)}</div>
              <button onclick="logout()" class="mt-3 w-full inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-white hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 text-slate-700 text-xs font-medium border border-slate-200 transition">
                ${ICONS.logout} Cerrar sesión
              </button>
            </div>
          </aside>

          <!-- Área principal -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-slate-200 px-6 py-3 flex flex-wrap items-center justify-between gap-3 md:hidden">
              <div class="font-bold text-sm text-slate-900">PolicyGuard-RAG</div>
              <div class="flex flex-wrap gap-1">
                ${tabs.map(t => `
                  <button onclick="state.activeTab='${t.id}';render();" class="px-2.5 py-1 rounded text-xs font-medium ${state.activeTab === t.id ? 'bg-blue-50 text-blue-700' : 'text-slate-600'}">${t.label}</button>
                `).join('')}
              </div>
            </header>

            <main class="max-w-6xl w-full mx-auto px-6 py-6 flex-1">
              ${contentHtml}
            </main>
          </div>
        </div>

        ${renderNewPolicyModal()}
      `;
    }

    render();
    if (state.token) loadAllData();
  </script>
</body>
</html>
